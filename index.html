<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>私立理系 入試カレンダー</title>
<script>(function () {
  var mob = /Android|iPhone|iPod|iPad|Mobile/i.test(navigator.userAgent || "") || (/Mac/.test(navigator.platform) && navigator.maxTouchPoints > 1);
  var l = null; try { l = localStorage.getItem("nyushical.layout"); } catch (e) {}
  var m = l || (mob || window.innerWidth < 760 ? "narrow" : "wide");
  document.documentElement.setAttribute("data-layout", m);
  if (m === "wide" && screen.width < 760) { var v = document.querySelector('meta[name="viewport"]'); if (v) v.setAttribute("content", "width=1200,initial-scale=" + (screen.width / 1200).toFixed(3)); }
})();</script>
<script>(function () { try { document.documentElement.setAttribute("data-theme", localStorage.getItem("nyushical.theme") || "light"); } catch (e) { document.documentElement.setAttribute("data-theme", "light"); } })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* 配置：上に見出しと絞り込み、本体は月めくりの壁掛けカレンダー（狭い画面は日付順の一覧）。試験日は大学ごとの色札、締切・発表は記号で重ねる */
:root{
  --bg:#F6F7F9;--surface:#FFFFFF;--sunk:#EEF0F4;--ink:#1A2130;--ink2:#4B5567;--ink3:#7B8596;--rule:#E1E5EB;--rule2:#C9CFD8;
  --accent:#2747A8;--sat:#2563C9;--sun:#C8322B;
  --apply:#B45309;--result:#15803D;--proc:#B91C1C;
  --chipL:93%;--chipInk:28%;--chipEdge:62%;
  --shadow:rgba(20,28,45,.16);
  --disp:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B;--surface:#1A1F27;--sunk:#222833;--ink:#E7EAF0;--ink2:#AEB6C3;--ink3:#7E8898;--rule:#2A313C;--rule2:#3A4350;
  --accent:#8EA6F2;--sat:#79A6F0;--sun:#F07A72;--apply:#F0A04B;--result:#5BC786;--proc:#F07272;
  --chipL:24%;--chipInk:86%;--chipEdge:45%;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B;--surface:#1A1F27;--sunk:#222833;--ink:#E7EAF0;--ink2:#AEB6C3;--ink3:#7E8898;--rule:#2A313C;--rule2:#3A4350;
  --accent:#8EA6F2;--sat:#79A6F0;--sun:#F07A72;--apply:#F0A04B;--result:#5BC786;--proc:#F07272;
  --chipL:24%;--chipInk:86%;--chipEdge:45%;--shadow:rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.65;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:24px;padding-block:28px 56px}

header.h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px;margin-bottom:20px}
header.h h1{margin:0;font-family:var(--disp);font-size:28px;line-height:1.3;letter-spacing:.02em;text-wrap:balance}
header.h h1 small{display:block;font-family:var(--font);font-size:13px;font-weight:400;color:var(--ink2);letter-spacing:0;margin-top:4px}
.status{max-width:46em;font-size:12px;color:var(--ink2);line-height:1.7}
.status b{color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:6px;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px var(--shadow)}
.tg{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.tg input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;font-size:12px;color:var(--ink2)}
.lgd span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.mk{display:inline-block;width:9px;height:9px;flex:0 0 auto}
.mk.apply{background:var(--apply);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk.result{background:var(--result);border-radius:50%}
.mk.proc{background:var(--proc)}
.mk.ex{width:14px;height:10px;border-radius:3px;background:hsl(220 60% var(--chipL));border:1px solid hsl(220 45% var(--chipEdge))}

.unis{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 18px}
.uc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:3px 11px 3px 8px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.uc i{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 60% 48%)}
.uc.on{color:var(--ink);border-color:hsl(var(--h) 45% var(--chipEdge));background:hsl(var(--h) 60% var(--chipL))}
.uc:not(.on) i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.uc.all{border-style:dashed}

/* 上の帯 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in oklab,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .in{max-width:1280px;margin:0 auto;padding-inline:24px;padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.brand i{display:block;width:4px;height:18px;border-radius:1px;background:var(--accent)}
.top .sp{margin-left:auto}
.ylab{font-size:12px;color:var(--ink3);white-space:nowrap}
.thm{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:var(--sunk);color:var(--ink2);cursor:pointer;padding:0;flex:0 0 auto}
.thm svg{width:16px;height:16px}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule2);border-left:1px solid var(--rule)}
.cal .wd{padding:6px 8px;font-size:12px;color:var(--ink2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule2);background:var(--surface)}
.cal .wd.su{color:var(--sun)}.cal .wd.sa{color:var(--sat)}
.cell{min-height:118px;padding:6px 6px 8px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface);min-width:0;display:flex;flex-direction:column;gap:3px}
.cell.out{background:var(--bg)}
.cell.out>*{opacity:.0}
.dn{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:700;line-height:1.2;margin-bottom:2px}
.dn.su,.dn.ho{color:var(--sun)}.dn.sa{color:var(--sat)}
.dn small{font-size:10.5px;font-weight:400;color:var(--sun)}
.chip{display:block;width:100%;text-align:left;border:1px solid hsl(var(--h) 45% var(--chipEdge));background:hsl(var(--h) 62% var(--chipL));color:hsl(var(--h) 55% var(--chipInk));border-radius:5px;padding:2px 6px;font-size:11.5px;line-height:1.4;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b,.row b{font-weight:700;margin-right:5px}
.chip .l1,.chip .l2{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .l2{font-size:10.5px;opacity:.8}
.chip em,.row em{font-style:normal;font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.row .l1,.row .l2{display:inline}.row .l2{margin-left:6px;opacity:.85;font-size:12px}
.chip:hover{filter:brightness(.97);box-shadow:0 1px 3px var(--shadow)}
.chip.pick{border-style:dashed}
.ev{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.35;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;background:none;padding:0 2px;text-align:left;width:100%}
.ev:hover{color:var(--ink)}
.more{font-size:11px;color:var(--accent);border:0;background:none;padding:0 2px;text-align:left;cursor:pointer}

/* 一覧 */
.list{border-top:1px solid var(--rule2)}
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.day .dd{font-weight:700;font-size:15px;line-height:1.3}
.day .dd small{display:block;font-size:11.5px;font-weight:400;color:var(--ink2)}
.day .dd.su,.day .dd.ho{color:var(--sun)}.day .dd.sa{color:var(--sat)}
.day .items{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:block;width:100%;text-align:left;border:1px solid hsl(var(--h) 45% var(--chipEdge));background:hsl(var(--h) 62% var(--chipL));color:hsl(var(--h) 55% var(--chipInk));border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;line-height:1.5}
.row b{margin-right:6px}
.row .sub{display:block;font-size:11.5px;opacity:.85;white-space:normal}
.row.pick{border-style:dashed}
.empty{padding:28px 0;color:var(--ink3)}

.foot{margin-top:28px;font-size:12px;color:var(--ink3);line-height:1.8;max-width:60em}

/* ツールチップ */
#tip{position:fixed;z-index:50;max-width:300px;padding:9px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.6;pointer-events:none;opacity:0;transition:opacity .08s;box-shadow:0 6px 18px var(--shadow)}
#tip b{font-size:12.5px}
#tip .k{opacity:.7}
#tip .old{display:inline-block;margin-left:4px;padding:0 5px;border-radius:3px;background:color-mix(in oklab,var(--bg) 22%,transparent);font-size:10.5px}

/* 詳細 */
dialog#dlg{border:0;padding:0;border-radius:12px;max-width:620px;width:calc(100% - 32px);max-height:calc(100% - 48px);background:var(--surface);color:var(--ink);box-shadow:0 18px 50px var(--shadow)}
dialog#dlg::backdrop{background:rgba(10,14,22,.45)}
.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;background:var(--surface);border-bottom:1px solid var(--rule)}
.dh .t{font-family:var(--disp);font-size:20px;line-height:1.35}
.dh .t small{display:block;font-family:var(--font);font-size:13px;color:var(--ink2);font-weight:400}
.dh .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:2px}
.x{border:0;background:var(--sunk);border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer;color:var(--ink2);flex:0 0 auto}
.db{padding:14px 20px 20px}
.flag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:700}
.flag.new{background:color-mix(in oklab,var(--result) 14%,transparent);color:var(--result)}
.flag.old{background:color-mix(in oklab,var(--apply) 15%,transparent);color:var(--apply)}
dl.kv{display:grid;grid-template-columns:7.5em minmax(0,1fr);column-gap:12px;margin:12px 0 0}
dl.kv dt,dl.kv dd{padding:9px 0;border-bottom:1px solid var(--rule);margin:0}
dl.kv dt{color:var(--ink2);font-size:12.5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.4}
.flag{white-space:nowrap}
.flag.tagd{background:var(--sunk);color:var(--ink2);margin-right:6px;white-space:normal}
dl.kv dd{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
dl.kv dd .n{display:block;font-size:12px;color:var(--ink2)}
.fac{margin:0;padding:0;list-style:none}
.fac li+li{margin-top:4px}
.fac b{margin-right:6px}
.links{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.links a{color:var(--accent);font-size:13px;text-decoration:none;overflow-wrap:anywhere}
.links a:hover{text-decoration:underline}
.links a.main{display:inline-block;align-self:flex-start;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--surface);font-weight:700}
.links a.main:hover{text-decoration:none;filter:brightness(1.08)}
.note2{margin-top:12px;font-size:12px;color:var(--ink2)}

/* スマホ表示（PCでも右上のボタンで選べる） */
html[data-layout="narrow"] .top .in{padding-inline:16px;gap:10px}
html[data-layout="narrow"] .ylab{display:none}
html[data-layout="narrow"] .wrap{padding-inline:16px;padding-block:20px 48px}
html[data-layout="narrow"] header.h h1{font-size:22px}
html[data-layout="narrow"] .lgd{margin-left:0}
html[data-layout="narrow"] .day{grid-template-columns:64px minmax(0,1fr)}
html[data-layout="narrow"] dialog#dlg{margin:auto auto 0;width:100%;max-width:none;border-radius:14px 14px 0 0;max-height:88%}
html[data-layout="narrow"] dl.kv{grid-template-columns:6.5em minmax(0,1fr)}
html[data-layout="narrow"] .wrap,html[data-layout="narrow"] .top .in{max-width:480px}
html[data-layout="narrow"] .seg button{padding:4px 9px;font-size:12px}
@media (max-width:430px){html[data-layout="narrow"] .brand{display:none}html[data-layout="narrow"] .top .sp,html[data-layout="narrow"] #years{margin-left:auto}}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
</style>
</head>
<body>

<div class="top"><div class="in">
  <div class="brand"><i></i>入試カレンダー</div>
  <span class="ylab sp">入試の年度</span>
  <div class="seg" id="years" role="group" aria-label="入試の年度"></div>
  <div class="seg" id="lyt" role="group" aria-label="表示"></div>
  <button class="thm" id="thm" type="button" aria-label="背景の白黒を切り替え"></button>
</div></div>
<div class="wrap">
  <header class="h">
    <h1>私立理系 一般入試カレンダー<small id="hsub"></small></h1>
    <p class="status" id="status"></p>
  </header>

  <div class="bar">
    <div class="seg" id="months" role="group" aria-label="月"></div>
    <div class="seg" id="views" role="group" aria-label="表示">
      <button data-v="cal">カレンダー</button><button data-v="list">一覧</button>
    </div>
    <label class="tg"><input type="checkbox" id="marks">出願締切・発表・手続もカレンダーに出す</label>
    <div class="lgd">
      <span><i class="mk ex"></i>試験日（押すと詳細）</span>
      <span><i class="mk apply"></i>出願締切</span>
      <span><i class="mk result"></i>合格発表</span>
      <span><i class="mk proc"></i>手続締切</span>
    </div>
  </div>
  <div class="unis" id="unis" aria-label="大学で絞り込む"></div>

  <div id="main"></div>

  <p class="foot">点線の札は、同じ試験を何日かに分けて実施するものです。何日受けられるかは札の1行目と詳細に書いています。日付は各大学の発表と河合塾 Kei-Net・旺文社パスナビをもとにしています。出願の前に、必ず各大学の募集要項で最新の日程を確認してください。</p>
</div>

<div id="tip" role="tooltip"></div>
<dialog id="dlg" aria-labelledby="dlgT"><div class="dh"><div class="t" id="dlgT"></div><button class="x" id="dlgX" aria-label="閉じる">×</button></div><div class="db" id="dlgB"></div></dialog>

<script src="years.js"></script>
<script>
(function () {
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  var Y = null, HOLI = {}, MONTHS = [], UNIVS = [], SRC = {}, EVENTS = [], UMAP = {};

  var S = { year: null, month: null, view: null, marks: false, off: {} };
  try { var sv = JSON.parse(localStorage.getItem("nyushical.v1") || "{}"); if (sv.year) S.year = sv.year; if (sv.month) S.month = sv.month; if (sv.view) S.view = sv.view; S.marks = !!sv.marks; S.off = sv.off || {}; } catch (e) {}
  function save() { try { localStorage.setItem("nyushical.v1", JSON.stringify({ year: S.year, month: S.month, view: S.view, marks: S.marks, off: S.off })); } catch (e) {} }

  // 年度のデータを読み込む（data-2027.js など）
  function loadYear(y, cb) {
    window.NYUSHI = window.NYUSHI || {};
    if (window.NYUSHI[y]) return cb();
    var info = YEARS.filter(function (x) { return x.y === y; })[0];
    var sc = document.createElement("script"); sc.src = info.file;
    sc.onload = cb;
    sc.onerror = function () { document.getElementById("main").innerHTML = '<p class="empty">' + y + "年度のデータを読み込めませんでした。ページを読み込み直してください。</p>"; };
    document.head.appendChild(sc);
  }
  function setYear(y) {
    Y = window.NYUSHI[y]; HOLI = Y.holidays; MONTHS = Y.months; UNIVS = Y.univs; SRC = Y.src; EVENTS = Y.events;
    UMAP = {}; UNIVS.forEach(function (u) { UMAP[u.id] = u; });
    EVENTS.forEach(function (e, i) { e.id = i; });
    if (!MONTHS.some(function (m) { return m[0] === S.month; })) S.month = Y.defaultMonth;
  }
  function viewNow() { return S.view || "list"; }

  function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function dt(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function key(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function md(s) { if (!s) return ""; var d = dt(s); return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WD[d.getDay()] + "）"; }
  function mdy(s) { if (!s) return ""; var d = dt(s); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）"; }
  function facShort(f) { return f.map(function (x) { return x[0].replace(/学部/g, "").replace(/（郡山）/, ""); }).join("・"); }
  function visible(e) { return !S.off[e.u]; }
  function oldTag(e) { return e.year < Y.y ? '<span class="old">前年度</span>' : ""; }

  // 日付ごとの札
  function byDay() {
    var m = {}, seen = {};
    function add(k, item) { (m[k] = m[k] || []).push(item); }
    EVENTS.forEach(function (e) {
      if (!visible(e)) return;
      e.slots.forEach(function (s) { add(s.d, { t: "ex", e: e, s: s }); });
      if (S.marks && e.year === Y.y) {
        // 同じ大学・同じ日・同じ種類の印は1つにまとめる
        [["apply", e.apply && e.apply[1]], ["result", e.result], ["proc", e.proc]].forEach(function (p) {
          if (!p[1]) return;
          var sk = e.u + p[0] + p[1]; if (seen[sk]) return; seen[sk] = 1;
          add(p[1], { t: p[0], e: e });
        });
      }
    });
    Object.keys(m).forEach(function (k) {
      m[k].sort(function (a, b) {
        var o = { ex: 0, apply: 1, result: 2, proc: 3 };
        return o[a.t] - o[b.t] || UNIVS.indexOf(UMAP[a.e.u]) - UNIVS.indexOf(UMAP[b.e.u]);
      });
    });
    return m;
  }
  var MK = { apply: "出願締切", result: "合格発表", proc: "手続締切" };

  function chip(it, cls) {
    var e = it.e, u = UMAP[e.u];
    if (it.t !== "ex") return '<button class="ev" data-id="' + e.id + '" data-mk="' + it.t + '"><i class="mk ' + it.t + '"></i>' + esc(u.short) + " " + MK[it.t] + "</button>";
    return '<button class="' + cls + (it.s.pick ? " pick" : "") + '" style="--h:' + u.hue + '" data-id="' + e.id + '" data-d="' + it.s.d + '"><span class="l1"><b>' + esc(u.short) + "</b>" + (it.s.tag ? "<em>" + esc(it.s.tag) + "</em>" : esc(e.method)) + '</span><span class="l2">' + esc(it.s.l2 || facShort(it.s.f)) + (it.s.tag ? "　" + esc(e.method) : "") + "</span>" +
      (cls === "row" ? '<span class="sub">' + esc(applyLine(e)) + "</span>" : "") + "</button>";
  }
  function applyLine(e) {
    if (!e.apply || !e.apply[1]) return "出願締切：未発表（要項で確認）";
    return "出願締切：" + md(e.apply[1]) + (e.year < Y.y ? "（前年度）" : "") + (e.apply[2] ? "　" + e.apply[2] : "");
  }

  function renderCal(m) {
    var y = +S.month.slice(0, 4), mo = +S.month.slice(5, 7) - 1;
    var first = new Date(y, mo, 1), start = new Date(y, mo, 1 - first.getDay());
    var last = new Date(y, mo + 1, 0), end = new Date(y, mo + 1, 0 + (6 - last.getDay()));
    var h = '<div class="cal">' + WD.map(function (w, i) { return '<div class="wd' + (i === 0 ? " su" : i === 6 ? " sa" : "") + '">' + w + "</div>"; }).join("");
    for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      var k = key(d), out = d.getMonth() !== mo, items = m[k] || [];
      var cls = d.getDay() === 0 ? " su" : d.getDay() === 6 ? " sa" : "";
      if (HOLI[k]) cls = " ho";
      h += '<div class="cell' + (out ? " out" : "") + '"><div class="dn' + cls + '">' + d.getDate() + (HOLI[k] ? "<small>" + HOLI[k] + "</small>" : "") + "</div>";
      if (!out) {
        var lim = 7, shown = items.slice(0, items.length > lim + 1 ? lim : items.length);
        h += shown.map(function (it) { return chip(it, "chip"); }).join("");
        if (items.length > shown.length) h += '<button class="more" data-day="' + k + '">ほか' + (items.length - shown.length) + "件を一覧で見る</button>";
      }
      h += "</div>";
    }
    return h + "</div>";
  }
  function renderList(m) {
    var keys = Object.keys(m).filter(function (k) { return k.slice(0, 7) === S.month; }).sort();
    if (!keys.length) return '<p class="empty">この月に表示する日程はありません。上の大学の絞り込みを確認してください。</p>';
    return '<div class="list">' + keys.map(function (k) {
      var d = dt(k), cls = HOLI[k] ? " ho" : d.getDay() === 0 ? " su" : d.getDay() === 6 ? " sa" : "";
      return '<div class="day" id="day-' + k + '"><div class="dd' + cls + '">' + (d.getMonth() + 1) + "/" + d.getDate() + "<small>" + WD[d.getDay()] + "曜" + (HOLI[k] ? "・" + HOLI[k] : "") + "</small></div>" +
        '<div class="items">' + m[k].map(function (it) { return chip(it, "row"); }).join("") + "</div></div>";
    }).join("") + "</div>";
  }

  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUNI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  function render() {
    var dk = document.documentElement.getAttribute("data-theme") === "dark";
    document.getElementById("thm").innerHTML = dk ? SUNI : MOON;
    document.getElementById("thm").title = dk ? "白い背景にする" : "黒い背景にする";
    var nw = document.documentElement.getAttribute("data-layout") === "narrow";
    document.getElementById("lyt").innerHTML = [["wide", "PC"], ["narrow", "スマホ"]].map(function (x) { return '<button data-lyt="' + x[0] + '" class="' + ((nw ? "narrow" : "wide") === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("");
    document.getElementById("years").innerHTML = YEARS.slice().sort(function (a, b) { return b.y - a.y; }).map(function (x) {
      return '<button data-y="' + x.y + '" class="' + (S.year === x.y ? "on" : "") + '">' + x.y + "年度</button>";
    }).join("");
    document.getElementById("hsub").textContent = Y.y + "年度入試（" + Y.enroll + "入学・試験は" + Y.exam + "）・" + UNIVS.length + "大学の理工系学部（生物系・薬学系を除く）";
    document.getElementById("status").innerHTML = "試験日はすべて <b>" + Y.y + "年度</b> の日程（大学発表または河合塾 Kei-Net 掲載）。出願締切・合格発表・手続締切は、" + Y.y + "年度がまだ発表されていない大学は <b>前年度の日付</b> を「前年度」と付けて表示しています（" + Y.asof + "時点）。";
    document.getElementById("months").innerHTML = MONTHS.map(function (x) { return '<button data-m="' + x[0] + '" class="' + (S.month === x[0] ? "on" : "") + '">' + x[1] + "</button>"; }).join("");
    document.querySelectorAll("#views button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-v") === viewNow()); });
    document.getElementById("marks").checked = S.marks;
    var allOn = UNIVS.every(function (u) { return !S.off[u.id]; });
    document.getElementById("unis").innerHTML = UNIVS.map(function (u) {
      return '<button class="uc' + (S.off[u.id] ? "" : " on") + '" style="--h:' + u.hue + '" data-u="' + u.id + '" aria-pressed="' + !S.off[u.id] + '"><i></i>' + esc(u.name) + "</button>";
    }).join("") + '<button class="uc all" data-all="1">' + (allOn ? "すべて外す" : "すべて表示") + "</button>";
    var m = byDay();
    document.getElementById("main").innerHTML = viewNow() === "cal" ? renderCal(m) : renderList(m);
  }

  // ツールチップ（試験日の札に乗せると出願締切を出す）
  var tip = document.getElementById("tip");
  function tipHtml(el) {
    var e = EVENTS[+el.getAttribute("data-id")], u = UMAP[e.u], mk = el.getAttribute("data-mk");
    var s = el.getAttribute("data-d") ? e.slots.filter(function (x) { return x.d === el.getAttribute("data-d"); })[0] : null;
    var h = "<b>" + esc(u.name) + "</b>　" + esc(e.method);
    if (s) h += "<br>" + esc(s.f.map(function (x) { return x[0] + (x[1] ? "（" + x[1] + "）" : ""); }).join("、"));
    if (mk) h += '<br><span class="k">' + MK[mk] + "</span>　" + md(mk === "apply" ? e.apply[1] : mk === "result" ? e.result : e.proc);
    else {
      h += '<br><span class="k">試験日</span>　' + md(s.d) + (s.tag ? "　" + esc(s.tag) : "") + (s.pick ? "<br>" + esc(s.pick) : "");
      h += '<br><span class="k">出願締切</span>　' + (e.apply && e.apply[1] ? md(e.apply[1]) + oldTag(e) + (e.apply[2] ? "　" + esc(e.apply[2]) : "") : "未発表");
    }
    return h + '<br><span class="k">押すと、科目・合格発表・要項へのリンクを表示</span>';
  }
  var cur = null;
  document.addEventListener("pointermove", function (ev) {
    if (ev.pointerType !== "mouse") return;
    var el = ev.target.closest && ev.target.closest(".chip,.ev");
    if (!el) { if (cur) { tip.style.opacity = 0; cur = null; } return; }
    if (el !== cur) { cur = el; tip.innerHTML = tipHtml(el); tip.style.opacity = 1; }
    var w = tip.offsetWidth, hgt = tip.offsetHeight, x = ev.clientX + 14, y = ev.clientY + 16;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
    if (y + hgt > window.innerHeight - 8) y = ev.clientY - hgt - 12;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  });

  // 詳細
  var dlg = document.getElementById("dlg");
  function srcObj(s) { return typeof s === "string" ? SRC[s] : s; }
  function openDetail(id) {
    var e = EVENTS[id], u = UMAP[e.u], old = e.year < Y.y, yl = Y.y + "年度";
    tip.style.opacity = 0; cur = null;
    document.getElementById("dlgT").innerHTML = '<span class="sw" style="background:hsl(' + u.hue + ' 60% 48%)"></span>' + esc(u.name) + "<small>" + esc(e.method) + "</small>";
    var fs = function (s) { return s.f.map(function (x) { return x[0] + (x[1] ? "（" + x[1] + "）" : ""); }).join("、"); };
    var same = e.slots.length > 1 && e.slots.every(function (s) { return s.pick && s.pick === e.slots[0].pick && fs(s) === fs(e.slots[0]); });
    var days = same ? "<li><b>" + e.slots.map(function (s) { return md(s.d); }).join("・") + "</b>" + '<span class="flag tagd">' + esc(e.slots[0].tag || "複数日実施") + "</span>" + esc(fs(e.slots[0])) + "</li>" : e.slots.map(function (s) {
      return "<li><b>" + md(s.d) + "</b>" + (s.tag ? '<span class="flag tagd">' + esc(s.tag) + "</span>" : "") + esc(s.f.map(function (x) { return x[0] + (x[1] ? "（" + x[1] + "）" : ""); }).join("、")) + "</li>";
    }).join("");
    var pick = e.slots[0].pick ? '<span class="n">' + esc(e.slots[0].pick) + "</span>" : "";
    function val(v, note) { return v ? mdy(v) + (note ? '<span class="n">' + esc(note) + "</span>" : "") : '<span style="color:var(--ink3)">未発表・要項で確認</span>'; }
    var ap = e.apply && e.apply[1] ? (e.apply[0] ? md(e.apply[0]) + " 〜 " : "") + mdy(e.apply[1]) + (e.apply[2] ? '<span class="n">' + esc(e.apply[2]) + "</span>" : "") : '<span style="color:var(--ink3)">未発表・要項で確認</span>';
    var tagD = old ? '<span class="flag old">前年度</span>' : '<span class="flag new">' + yl + '</span>';
    var h = '<p style="margin:0;font-size:12.5px;color:var(--ink2)">' + (old ?
      "試験日は" + yl + "の日程です。出願・発表・手続は" + yl + "がまだ発表されていないため、<b>前年度（" + (Y.y - 1) + "年度入試）の日付</b>を参考として載せています。" :
      "すべて" + yl + "入試の日程です。") + "</p>";
    h += '<dl class="kv"><dt>試験日 <span class="flag new">' + yl + '</span></dt><dd><ul class="fac">' + days + "</ul>" + pick + "</dd>" +
      "<dt>出願期間 " + tagD + "</dt><dd>" + ap + "</dd>" +
      "<dt>合格発表 " + tagD + "</dt><dd>" + val(e.result, e.resultNote) + "</dd>" +
      "<dt>手続締切 " + tagD + "</dt><dd>" + val(e.proc, e.procNote) + "</dd>" +
      "<dt>試験科目</dt><dd>" + (e.subjects ? esc(e.subjects) : '<span style="color:var(--ink3)">要項で確認</span>') + "</dd>" +
      "<dt>英検など</dt><dd>" + (e.eiken ? esc(e.eiken) : '<span style="color:var(--ink3)">要項で確認</span>') + "</dd></dl>";
    if (e.note) h += '<p class="note2">※ ' + esc(e.note) + "</p>";
    var srcs = e.src.map(srcObj);
    var main = srcs.filter(function (s) { return !/Kei-Net|パスナビ/.test(s.label); })[0] || srcs[0];
    h += '<div class="links"><a class="main" href="' + esc(main.url) + '" target="_blank" rel="noopener">募集要項・大学の入試ページを開く</a>' +
      srcs.map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">出典：' + esc(s.label) + "</a>"; }).join("") + "</div>";
    document.getElementById("dlgB").innerHTML = h;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  }
  document.getElementById("dlgX").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (ev) { if (ev.target === dlg) dlg.close(); });

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target : null; if (!t) return;
    var b;
    if ((b = t.closest("[data-y]"))) { var ny = +b.getAttribute("data-y"); loadYear(ny, function () { S.year = ny; setYear(ny); save(); render(); }); return; }
    if ((b = t.closest("[data-lyt]"))) {
      var nl = b.getAttribute("data-lyt"); document.documentElement.setAttribute("data-layout", nl);
      try { localStorage.setItem("nyushical.layout", nl); } catch (e) {}
      if (screen.width < 760) { location.reload(); return; }   // スマホでは画面の幅を付け直すため読み込み直す
      return render();
    }
    if (t.closest("#thm")) { var nd = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nd); try { localStorage.setItem("nyushical.theme", nd); } catch (e) {} return render(); }
    if ((b = t.closest("[data-m]"))) { S.month = b.getAttribute("data-m"); save(); return render(); }
    if ((b = t.closest("[data-v]"))) { S.view = b.getAttribute("data-v"); save(); return render(); }
    if ((b = t.closest("[data-u]"))) { var id = b.getAttribute("data-u"); if (S.off[id]) delete S.off[id]; else S.off[id] = 1; save(); return render(); }
    if ((b = t.closest("[data-all]"))) { var allOn = UNIVS.every(function (u) { return !S.off[u.id]; }); S.off = {}; if (allOn) UNIVS.forEach(function (u) { S.off[u.id] = 1; }); save(); return render(); }
    if ((b = t.closest("[data-day]"))) { var k = b.getAttribute("data-day"); S.view = "list"; save(); render(); var el = document.getElementById("day-" + k); if (el) el.scrollIntoView({ block: "start" }); return; }
    if ((b = t.closest("[data-id]"))) { openDetail(+b.getAttribute("data-id")); return; }
  });
  document.getElementById("marks").addEventListener("change", function (ev) { S.marks = ev.target.checked; save(); render(); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () {
    var saved = null; try { saved = localStorage.getItem("nyushical.layout"); } catch (e) {}
    if (!saved) { var a = window.innerWidth < 760 ? "narrow" : "wide"; if (a !== document.documentElement.getAttribute("data-layout")) { document.documentElement.setAttribute("data-layout", a); render(); } }
  }, 150); });
  // 最初は保存した年度、なければいちばん新しい年度
  var newest = YEARS.reduce(function (m, x) { return Math.max(m, x.y); }, 0);
  if (!YEARS.some(function (x) { return x.y === S.year; })) S.year = newest;
  loadYear(S.year, function () { setYear(S.year); render(); });
})();
</script>

</body>
