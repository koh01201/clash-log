name: collect

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect battles
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: python collect_battles.py

      - name: Build report
        run: python analyze.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add battles.csv report.html
          git diff --staged --quiet || git commit -m "update battles.csv"
          git push
